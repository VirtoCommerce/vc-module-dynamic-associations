<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Dynamic Associations">
  <title>Dynamic Associations</title>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="92%" y2="100%">
      <stop offset="0%" stop-color="#3FD8B4"/>
      <stop offset="100%" stop-color="#0E9E80"/>
    </linearGradient>
    <filter id="lift" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="3.5" flood-color="#064F40" flood-opacity="0.30"/>
    </filter>
  </defs>

  <rect width="128" height="128" rx="28" fill="url(#bg)"/>

  <g transform="translate(64,64)" filter="url(#lift)">
    <!-- Association links -->
    <g stroke="#ffffff" stroke-width="4.5" stroke-linecap="round">
      <line x1="0" y1="0" x2="32" y2="-28"/>
      <line x1="0" y1="0" x2="-34" y2="-6"/>
      <line x1="0" y1="0" x2="4" y2="32"/>
    </g>

    <!-- Related product nodes -->
    <rect x="22" y="-38" width="21" height="21" rx="5" fill="#FFC24D"/>
    <rect x="-44" y="-16" width="21" height="21" rx="5" fill="#5FC8F5"/>
    <rect x="-6" y="22" width="21" height="21" rx="5" fill="#9D86F5"/>

    <!-- Central product -->
    <rect x="-16" y="-16" width="32" height="32" rx="7" fill="#ffffff"/>
    <rect x="-9" y="-9" width="18" height="18" rx="3" fill="#0E9E80"/>
  </g>
</svg>
